name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Nx affected needs history to diff against the base.
          fetch-depth: 0

      # No `version` here: package.json's packageManager is the one source,
      # and action-setup errors out when both are given.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint test build --base=origin/${{ github.base_ref }}

      - name: Verify (main)
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t lint test build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Real-browser checks
        run: pnpm nx e2e examples

      - name: Check formatting
        run: pnpm format:check
